<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sree MK Food Court — Restaurant Menu</title>
    <meta name="description" content="Offline Digital QR Menu for Sree MK Food Court Restaurant. Good Food. Good Mood." />
    
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0c2419" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sree MK Menu" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />

    <!-- Pure Local Stylesheet & Offline-ready Reset -->
    <style>
      /* Fallback system typography - 100% offline */
      html {
        background-color: #0c2419;
        color: #fcfbf7;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #0c2419;
        min-height: 100vh;
      }
      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #071811;
      }
      ::-webkit-scrollbar-thumb {
        background: #25654b;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ca8a04;
      }
    </style>
  </head>
  <body class="bg-forest-900 text-cream-50 antialiased selection:bg-gold-500 selection:text-forest-950">
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Offline Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => {
              console.log('[PWA] Service Worker registered with scope:', reg.scope);
            })
            .catch(err => {
              console.log('[PWA] Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
